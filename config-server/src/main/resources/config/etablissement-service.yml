server:
  port: 8081

spring:
  application:
    name: etablissement-service
  datasource:
    url: 'jdbc:h2:file:./data/etablissement;DB_CLOSE_ON_EXIT=FALSE'
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

seed:
  enabled: true
