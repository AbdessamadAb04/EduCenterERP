# App
spring.application.name=EduCenterERP

# H2 Database (file-backed so data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/educenter;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Receipt generation (override with absolute paths if python/reportlab is not on PATH)
receipt.python-path=python
receipt.script-path=scripts/generate_receipt.py
