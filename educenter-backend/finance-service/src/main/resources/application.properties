server.port=8083
spring.application.name=finance-service
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.name=finance-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=jdbc:h2:file:./data/finance;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

receipt.python-path=python
receipt.script-path=scripts/generate_receipt.py

services.formation.url=http://localhost:8082

seed.enabled=true
seed.etablissement-id=1
