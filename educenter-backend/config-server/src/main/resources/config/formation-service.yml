server:
  port: 8082

spring:
  application:
    name: formation-service
  datasource:
    url: 'jdbc:h2:file:./data/formation;DB_CLOSE_ON_EXIT=FALSE'
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

seed:
  enabled: true
  etablissement-id: 1

services:
  finance:
    url: http://localhost:8083
