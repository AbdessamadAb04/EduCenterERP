server:
  port: 8083

spring:
  application:
    name: finance-service
  datasource:
    url: 'jdbc:h2:file:./data/finance;DB_CLOSE_ON_EXIT=FALSE'
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

receipt:
  python-path: python
  script-path: scripts/generate_receipt.py

services:
  formation:
    url: http://localhost:8082

seed:
  enabled: true
  etablissement-id: 1
