server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted

spring.cloud.gateway.server.webflux.routes[0].id=etablissement-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ETABLISSEMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/etablissements,/api/etablissements/**,/api/users,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=formation-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FORMATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/classes,/api/classes/**,/api/students,/api/students/**,/api/sessions,/api/sessions/**

spring.cloud.gateway.server.webflux.routes[2].id=finance-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://FINANCE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/payments,/api/payments/**,/api/dashboard,/api/dashboard/**
